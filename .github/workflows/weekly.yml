name: Weekly Portfolio Briefing

on:
  # 매주 월요일 08:00 KST (UTC 기준 월요일 23:00 = 일요일 23:00 UTC)
  schedule:
    - cron: "0 23 * * 0"
  # 수동 실행 버튼도 활성화 (테스트용)
  workflow_dispatch:

# 리포트를 레포에 커밋하려면 쓰기 권한 필요
permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install yfinance finance-datareader pyyaml pandas

      - name: 리포트 생성
        run: python main.py

      - name: 생성된 리포트 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "주간 리포트 자동 생성"
          git push
